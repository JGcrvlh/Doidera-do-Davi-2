[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "candidate-copilot"
version = "0.1.0"
description = "Assistente local de processos seletivos: captura de tela -> OCR -> contexto da vaga -> sugestao de resposta revisavel"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "anthropic>=0.40",
    "SQLAlchemy>=2.0",
    "keyring>=24.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
capture = ["mss>=9.0", "pynput>=1.7"]
ocr = ["rapidocr-onnxruntime>=1.3", "numpy>=1.26"]
ui = ["PySide6>=6.6"]
full = [
    "candidate-copilot[capture]",
    "candidate-copilot[ocr]",
    "candidate-copilot[ui]",
]
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.10"]

[project.scripts]
copilot = "copilot.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/copilot"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM108", "SIM115"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
